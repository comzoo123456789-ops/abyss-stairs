# Cloudflare 배포 설정 — 정적 자산만 올리는 Worker.
#
# ⚠ Cloudflare 가 Pages 를 Workers 로 통합했다. 지금 wrangler 는
#   `wrangler pages ...` 를 쓰면 "Pages, now part of Cloudflare Workers" 라며
#   Workers 쪽으로 넘긴다. 그래서 Pages 프로젝트가 아니라 **정적 자산 Worker** 로 둔다.
#   결과는 같고(주소 · 깃 연동 · 무료 한도) 명령이 하나로 줄어든다.
#
# 배포:  npx wrangler deploy
#
# ⚠ directory 를 "." 로 두지 말 것. 그러면 tools/ 의 검사 도구가 웹에 그대로
#   내려가고 저장소를 비공개로 둔 의미가 반쯤 사라진다. 올리는 것은 public/ 뿐이다.
#   (공간잇다에서 directory="." 때문에 `wrangler dev` 가 무한 리로드했던 적도 있다)

name = "abyss-arpg"
main = "src/index.js"
compatibility_date = "2026-09-18"

# ⚠ 자산에 **binding 을 준다.** main 이 생기면 Worker 가 모든 요청을 먼저
#   받으므로, `/api/` 가 아닌 것을 우리가 다시 자산으로 넘겨야 한다.
#   binding 이 없으면 env.ASSETS 가 undefined 라 화면이 통째로 안 뜬다.
[assets]
directory = "./public"
binding = "ASSETS"

# 계정과 저장. ⚠ 게임은 여전히 localStorage 로 돈다 — 여기는 **사본**이다.
[[d1_databases]]
binding = "DB"
database_name = "abyss-arpg-db"
database_id = "4c94a251-94af-43b6-85e6-a6a1ea60c276"

# 없는 경로는 404 를 준다. 이 게임은 한 페이지짜리라 SPA 폴백이 필요 없다 —
# 폴백을 켜면 오타 난 주소가 조용히 게임 화면으로 열려 오해를 만든다.
not_found_handling = "none"

[observability]
enabled = true
