<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심연의 계단</title>
<meta name="description" content="마을에서 캐릭터를 키워 심연으로 내려가는 실시간 던전 RPG.">
<!-- ⚠ Pretendard 를 **실제로 받아 와야** 한다. 이름만 적어 두고 링크가 없으면
     조용히 맑은 고딕으로 떨어진다 — 오류도 안 난다(전에 그렇게 당했다). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="css/rpg.css?v=75">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23221f28'/><rect x='7' y='0' width='2' height='2' fill='%23d24a3a'/><rect x='4' y='2' width='8' height='5' fill='%23b8bec9'/><rect x='3' y='7' width='10' height='5' fill='%238a919e'/><rect x='2' y='7' width='2' height='5' fill='%239c2f2a'/></svg>">
</head>
<script>
  /* 캔버스 안의 숫자는 CSS 를 못 읽는다 — 여기서 준다.
     ⚠ rpg.css 의 글꼴과 **같은 값**이어야 한다. 두 벌이 되면 화면 안팎이 달라진다. */
  window.NUM_FONT = "\"Galmuri11\", \"Pretendard Variable\", monospace";
</script>
<body>

<div class="app">
  <div class="viewport"><canvas id="view"></canvas></div>

  <!-- 상단 헤더: 좌측 상태 뱃지 & 미니맵 + 우측 통합 퀵 메뉴바 -->
  <div class="top-bar">
    <div class="top-left">
      <div id="diag" class="diag">…</div>
      <div id="minimapBox" class="minimap-box" style="display:none">
        <canvas id="minimap" width="112" height="80"></canvas>
      </div>
    </div>
    <div id="topMenu" class="top-menu">
      <button id="btnHamb" class="tbtn hamb-btn" title="전체 메뉴"><span class="t-ico">☰</span><span class="t-lbl">메뉴</span></button>
      <button id="btnBag" class="tbtn" title="가방 / 장비 (I)"><span class="t-ico">🎒</span><span class="t-lbl">가방</span><kbd>I</kbd></button>
      <button id="btnSkills" class="tbtn" title="재주책 / 스킬트리 (K)"><span class="t-ico">📜</span><span class="t-lbl">스킬</span><kbd>K</kbd></button>
      <button id="btnClass" class="tbtn" title="직업 선택 / 캐릭터 변경"><span class="t-ico">👤</span><span class="t-lbl">직업</span></button>
      <button id="btnPotion" class="tbtn" title="생명력 물약 마시기 (Q)"><span class="t-ico">🧪</span><span class="t-lbl">물약</span><b class="t-badge" id="potNum">0</b><kbd>Q</kbd></button>
    </div>
  </div>

  <!-- 모바일 가상 조이스틱 (좌측 엄지 영역) -->
  <div id="vstick" class="vstick" style="display:none">
    <div class="vstick-base">
      <div class="vstick-knob"></div>
    </div>
  </div>

  <!-- 모바일 우측 액션 & 스킬 클러스터 패드 (우측 엄지 영역) -->
  <div id="actionPad" class="action-pad">
    <button id="btnSkill1" class="act-btn act-sk" data-slot="0">
      <canvas class="act-ico"></canvas><i class="cool"></i><span class="cd"></span><b class="lbl">1</b>
    </button>
    <button id="btnSkill2" class="act-btn act-sk" data-slot="1">
      <canvas class="act-ico"></canvas><i class="cool"></i><span class="cd"></span><b class="lbl">2</b>
    </button>
    <button id="btnSkill3" class="act-btn act-sk" data-slot="2">
      <canvas class="act-ico"></canvas><i class="cool"></i><span class="cd"></span><b class="lbl">3</b>
    </button>
    <button id="btnSkill4" class="act-btn act-sk" data-slot="3">
      <canvas class="act-ico"></canvas><i class="cool"></i><span class="cd"></span><b class="lbl">4</b>
    </button>
    <button id="btnTouchInteract" class="act-btn act-e" title="상호작용 (E)">
      <span class="act-ico-txt">🖐️</span><span class="lbl">E</span>
    </button>
    <button id="btnTouchAtk" class="act-btn act-atk" title="공격">
      <span class="act-ico-txt">⚔️</span><span class="lbl">공격</span>
    </button>
    <button id="btnTouchPotion" class="act-btn act-pot" title="물약 마시기 (Q)">
      <span class="act-ico-txt">🧪</span><b class="lbl">물약 <span id="btnTouchPotNum">0</span></b><i class="cool"></i><span class="cd"></span>
    </button>
    <button id="btnTouchRecall" class="act-btn act-rec" title="마을 귀환 (T)">
      <span class="act-ico-txt">🏛️</span><span class="lbl">귀환</span>
    </button>
  </div>

  <!-- 지금 누를 수 있는 것. -->
  <div id="act" class="act"></div>
  <!-- 층 선택 창. 캔버스가 아니라 DOM 이다(키보드로 고를 수 있어야 한다). -->
  <div id="panel" class="panel" hidden style="display:none"></div>
  <!-- 짧은 알림. 못 한 일에는 왜 못 했는지를 말해야 한다. -->
  <div id="toast" class="toast"></div>
  <!-- 허수아비 타격 측정. 마을에서 때리면 저절로 뜬다.
       ⚠ 스크립트 앞에 둔다 — 뒤에 두면 배선이 통째로 안 붙는다(겪은 함정). -->
  <div id="dpsMeter" class="dps-meter" hidden></div>

  <!-- 아래 줄 — 구슬 · 퀵슬롯 · 힌트 -->
  <div class="bottom">
    <div class="orb orb-hp"  title="체력"><i class="fill"></i><b class="num" id="hpNum">0</b></div>
    <div id="skillbar" class="skillbar"></div>
    <div class="orb orb-st"  title="기력"><i class="fill"></i><b class="num" id="stNum">0</b></div>
  </div>
  <!-- 조작 안내. 키는 자판 모양(.hk b)으로 세운다 - 글줄로 이어 쓰면 어디까지가
       키인지 눈이 매번 갈라 읽는다. 좁은 화면에서는 통째로 감춘다(손가락으로 논다). -->
  <div class="hint">
    <span class="hk"><b>W</b><b>A</b><b>S</b><b>D</b> 이동</span>
    <span class="hk"><b>마우스</b> 조준</span>
    <span class="hk"><b>클릭</b> 공격</span>
    <span class="hk"><b>1</b><b>2</b><b>3</b><b>4</b> 재주</span>
    <span class="hk"><b>E</b> 조작</span>
    <span class="hk"><b>I</b> 가방</span>
    <span class="hk"><b>K</b> 재주책</span>
    <span class="hk"><b>Q</b> 물약</span>
    <span class="hk"><b>T</b> 귀환</span>
  </div>
</div>

<script src="js/sprites.js?v=75"></script>
<script src="js/sprites-art.js?v=75"></script>
<script src="js/sound.js?v=75"></script>
<script src="js/data.js?v=75"></script>
<script src="js/items.js?v=75"></script>
<script src="js/save.js?v=75"></script>
<script src="js/dungeon.js?v=75"></script>
<script src="js/town.js?v=75"></script>
<script src="js/combat.js?v=75"></script>
<script src="js/skills.js?v=75"></script>
<script src="js/classes.js?v=75"></script>
<script src="js/world.js?v=75"></script>
<script src="js/ai.js?v=75"></script>
<script src="js/view.js?v=75"></script>
<script src="js/app.js?v=75"></script>

  <div id="mobileDropdown" class="mobile-dropdown">
    <button id="mBtnTest" class="mitem" style="color:#ffd700;font-weight:bold;"><span class="ico">🎁</span><span>전설 장비 받기 (테스트)</span></button>
    <button id="mBtnStat" class="mitem"><span class="ico">👤</span><span>내 정보 / 능력치</span></button>
    <button id="mBtnBag" class="mitem"><span class="ico">🎒</span><span>가방 / 장비</span><kbd>I</kbd></button>
    <button id="mBtnSkills" class="mitem"><span class="ico">✨</span><span>스킬북</span><kbd>K</kbd></button>
    <button id="mBtnClass" class="mitem"><span class="ico">🎭</span><span>직업 / 캐릭터 선택</span></button>
    <button id="mBtnPotion" class="mitem"><span class="ico">🧪</span><span>물약 마시기</span><kbd>Q</kbd></button>
  </div>
</body>
</html>
