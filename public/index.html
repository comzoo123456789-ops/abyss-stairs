<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심연의 계단</title>
<meta name="description" content="마을에서 캐릭터를 키워 심연으로 내려가는 실시간 던전 RPG.">
<!-- ⚠ Pretendard 를 **실제로 받아 와야** 한다. 이름만 적어 두고 링크가 없으면
     조용히 맑은 고딕으로 떨어진다 — 오류도 안 난다(전에 그렇게 당했다). -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="css/rpg.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23221f28'/><rect x='7' y='0' width='2' height='2' fill='%23d24a3a'/><rect x='4' y='2' width='8' height='5' fill='%23b8bec9'/><rect x='3' y='7' width='10' height='5' fill='%238a919e'/><rect x='2' y='7' width='2' height='5' fill='%239c2f2a'/></svg>">
</head>
<script>
  /* 캔버스 안의 숫자는 CSS 를 못 읽는다 — 여기서 준다.
     ⚠ rpg.css 의 글꼴과 **같은 값**이어야 한다. 두 벌이 되면 화면 안팎이 달라진다. */
  window.NUM_FONT = "\"Galmuri11\", \"Pretendard Variable\", monospace";
</script>
<body>

<div class="app">
  <div class="viewport"><canvas id="view"></canvas></div>
  <!-- 뼈대를 세우는 동안 **재는 자리**. 눈으로는 60Hz 규칙이 맞는지 모른다. -->
  <div id="diag" class="diag">…</div>
  <!-- 지금 누를 수 있는 것. **눌러야 뭔가 일어나는 자리에는 반드시 글자가 있어야
       한다** — 표시가 없으면 회원은 그 자리를 그냥 지나친다. -->
  <div id="act" class="act"></div>
  <!-- 층 선택 창. 캔버스가 아니라 DOM 이다(키보드로 고를 수 있어야 한다). -->
  <div id="panel" class="panel" hidden style="display:none"></div>
  <!-- 짧은 알림. 못 한 일에는 **왜 못 했는지**를 말해야 한다 —
       아무 일도 안 일어나면 회원은 고장으로 느낀다. -->
  <div id="toast" class="toast"></div>
  <div class="hint">WASD · 방향키 이동 &nbsp;·&nbsp; 마우스 조준 · 클릭/스페이스 공격 &nbsp;·&nbsp; E 조작 · I 가방 · Q 물약 · T 귀환</div>
</div>

<script src="js/sprites.js?v=2"></script>
<script src="js/sprites-art.js?v=2"></script>
<script src="js/sound.js?v=2"></script>
<script src="js/items.js?v=2"></script>
<script src="js/save.js?v=2"></script>
<script src="js/dungeon.js?v=2"></script>
<script src="js/town.js?v=2"></script>
<script src="js/combat.js?v=2"></script>
<script src="js/world.js?v=2"></script>
<script src="js/ai.js?v=2"></script>
<script src="js/view.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
